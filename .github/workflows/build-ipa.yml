name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project SocksBypass.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project SocksBypass.xcodeproj \
            -scheme SocksBypass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SocksBypass-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SocksBypass-unsigned-ipa
          path: SocksBypass-unsigned.ipa
